<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brumeval</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15122B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brumeval">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --page: #E6E0F4;
  --night: #241F45;
  --deep: #15122B;
  --fire: #F6B44B;
  --fire-dark: #B9741E;
  --fire-light: #FFD994;
  --lilac: #C6B5F2;
  --text: #F4EFE1;
  --muted: #A49DCB;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --page: #0E0C1E; color-scheme: dark; }
}
:root[data-theme="dark"] { --page: #0E0C1E; color-scheme: dark; }
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; height: 100dvh; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; height: 100%;
  background: var(--page);
  display: flex; justify-content: center;
  font-family: "VT323", "Courier New", monospace;
}
.screen {
  position: relative;
  width: 100%; max-width: 440px; height: 100%;
  background: var(--deep); color: var(--text);
  display: flex; flex-direction: column;
  overflow: hidden;
  user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.scene { position: relative; flex: none; }
canvas { display: block; width: 100%; aspect-ratio: 160 / 176; max-height: 40vh; max-height: 40dvh; object-fit: cover; object-position: center bottom; transition: max-height .4s steps(6); image-rendering: pixelated; image-rendering: crisp-edges; }
.screen.compact canvas { max-height: 28vh; max-height: 28dvh; }
@media (max-height: 740px) {
  canvas { max-height: 32vh; max-height: 32dvh; }
  .screen.compact canvas { max-height: 22vh; max-height: 22dvh; }
  .say { font-size: 22px !important; }
  .opt { font-size: 21px !important; padding-top: 10px !important; padding-bottom: 10px !important; }
  .opt::before { top: 10px !important; }
  .box { padding-top: 11px !important; }
  .panel { gap: 8px !important; padding-top: 10px !important; }
}
.px { font-family: "Press Start 2P", "Courier New", monospace; }

.sound {
  position: absolute; top: 10px; right: 10px;
  font-family: "Press Start 2P", monospace; font-size: 9px;
  color: var(--text); background: rgba(21, 18, 43, .7);
  border: 2px solid var(--lilac); padding: 7px 8px; cursor: pointer;
}
.sound:focus-visible, .btn:focus-visible, .panel:focus-visible { outline: 3px solid var(--fire); outline-offset: 2px; }

.title {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding-top: 22%;
  text-align: center; pointer-events: none;
}
.title h1 {
  margin: 0; font-family: "Press Start 2P", monospace; font-weight: 400;
  font-size: clamp(20px, 7vw, 28px); line-height: 1.3; color: var(--fire);
  text-shadow: 3px 3px 0 var(--deep), -1px -1px 0 var(--fire-dark);
}
.title p { margin: 10px 0 0; font-size: 20px; color: var(--lilac); text-shadow: 2px 2px 0 var(--deep); }

.panel {
  flex: 1; min-height: 0;
  display: flex; flex-direction: column; gap: 12px;
  padding: 14px 14px 16px;
  overflow-y: auto;
}
.box {
  position: relative;
  background: var(--night);
  border: 4px solid var(--lilac);
  box-shadow: 0 0 0 4px var(--deep), 0 0 0 6px var(--muted);
  margin: 6px;
  padding: 14px 16px 26px;
}
.who { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--fire); margin-bottom: 10px; }
.say { font-size: 25px; line-height: 1.12; min-height: 2.3em; }
.more {
  position: absolute; right: 12px; bottom: 8px;
  font-family: "Press Start 2P", monospace; font-size: 9px; color: var(--lilac);
  animation: blink 1s steps(2, start) infinite;
}
.hint { text-align: center; font-size: 20px; color: var(--muted); margin: 4px 0 0; animation: blink 1.2s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }

.bar { height: 22px; border: 4px solid var(--lilac); background: var(--deep); padding: 2px; }
.fill { height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--fire) 0 10px, var(--fire-dark) 10px 12px); }
.pct { font-family: "Press Start 2P", monospace; font-size: 10px; color: var(--muted); text-align: right; margin-top: 8px; }
.tip { font-size: 22px; line-height: 1.15; min-height: 2.4em; }

.quest h2 { margin: 0 0 4px; font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 13px; line-height: 1.5; color: var(--fire); }
.quest .meta { font-size: 20px; color: var(--muted); margin: 0 0 12px; }
.quest ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.quest li { display: grid; grid-template-columns: 18px 1fr; gap: 10px; font-size: 21px; line-height: 1.1; }
.quest li::before { content: ""; width: 14px; height: 14px; margin-top: 3px; border: 3px solid var(--lilac); }
.quest li b { font-weight: 400; color: var(--fire-light); }
.reward { margin-top: 14px; padding-top: 10px; border-top: 3px dashed var(--muted); font-size: 21px; }
.reward span { color: var(--fire-light); }

.btn {
  display: block; width: calc(100% - 12px); margin: 4px 6px 0;
  font-family: "Press Start 2P", monospace; font-size: 12px; line-height: 1.4;
  padding: 16px 12px; cursor: pointer;
  color: var(--deep); background: var(--fire); border: 0;
  box-shadow: inset -4px -4px 0 var(--fire-dark), inset 4px 4px 0 var(--fire-light), 0 0 0 4px var(--deep);
}
.btn:active { transform: translateY(2px); box-shadow: inset 4px 4px 0 var(--fire-dark), 0 0 0 4px var(--deep); }
.btn.ghost { background: transparent; color: var(--lilac); box-shadow: inset 0 0 0 3px var(--lilac); }

.toast {
  position: absolute; left: 12px; right: 12px; top: 12px; z-index: 5;
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center;
  background: var(--deep); border: 4px solid var(--fire);
  box-shadow: 0 0 0 4px var(--deep);
  padding: 10px 12px;
  transform: translateY(-160%); transition: transform .35s steps(5);
}
.toast.on { transform: translateY(0); }
.toast canvas { width: 44px; aspect-ratio: 1; }
.toast small { display: block; font-family: "Press Start 2P", monospace; font-size: 8px; color: var(--muted); margin-bottom: 6px; }
.toast strong { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 12px; color: var(--fire); }

.end { text-align: center; }
.end .big { font-family: "Press Start 2P", monospace; font-size: clamp(18px, 6vw, 24px); line-height: 1.4; color: var(--fire); margin: 6px 0 12px; text-shadow: 3px 3px 0 var(--deep); }
.end p { font-size: 24px; line-height: 1.15; margin: 0 0 8px; }
.end .sign { color: var(--muted); font-size: 20px; }

.flash { position: absolute; inset: 0; background: var(--text); opacity: 0; pointer-events: none; z-index: 4; }
.flash.go { animation: flash .5s steps(4) forwards; }
@keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .more, .hint { animation: none; }
  .toast { transition: none; }
  .flash.go { animation: none; }
}

.opts { display: grid; gap: 12px; margin: 2px 6px 0; }
.opts[hidden], .gain[hidden], .more[hidden], .hint[hidden] { display: none; }
.opt {
  font-family: "VT323", "Courier New", monospace; font-size: 23px; line-height: 1.05; text-align: left;
  color: var(--text); background: var(--deep); cursor: pointer;
  border: 0; box-shadow: inset 0 0 0 3px var(--lilac);
  padding: 13px 14px 13px 40px; position: relative;
}
.opt::before { content: "►"; position: absolute; left: 14px; top: 13px; color: var(--fire); font-size: 18px; }
.opt:active { background: var(--night); }
.opt:focus-visible, .field input:focus-visible { outline: 3px solid var(--fire); outline-offset: 2px; }
.gain { margin-top: 10px; font-family: "Press Start 2P", monospace; font-size: 9px; line-height: 1.6; color: var(--fire-light); }
.field { display: grid; gap: 10px; margin: 0; min-width: 0; }
.field label { font-size: 23px; }
.field input {
  font-family: "Press Start 2P", monospace; font-size: 16px; padding: 14px 12px; width: 100%; min-width: 0; max-width: 100%;
  color: var(--text); background: var(--deep); border: 0; box-shadow: inset 0 0 0 3px var(--lilac);
  border-radius: 0; -webkit-appearance: none; appearance: none; user-select: text; -webkit-user-select: text;
}
.end .reveal { font-size: 23px; color: var(--lilac); }
.item {
  display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center;
  width: calc(100% - 12px); margin: 2px 6px 0; padding: 10px 12px; cursor: pointer; text-align: left;
  color: var(--text); background: var(--night); border: 0;
  box-shadow: inset 0 0 0 3px var(--fire), 0 0 0 4px var(--deep);
  animation: itemBob 1.2s steps(2, start) infinite;
}
.item:focus-visible { outline: 3px solid var(--lilac); outline-offset: 3px; }
.item canvas { width: 52px; aspect-ratio: 1; image-rendering: pixelated; }
.item small { display: block; font-family: "Press Start 2P", monospace; font-size: 9px; color: var(--fire); margin-bottom: 6px; }
.item span { font-size: 22px; line-height: 1.05; }
@keyframes itemBob { 50% { transform: translateY(-3px); } }

.viewer {
  position: absolute; inset: 0; z-index: 10;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  padding: 20px 16px;
  background: rgba(14, 12, 30, .97);
}
.viewer[hidden] { display: none; }
.viewer .hint2 { font-size: 20px; color: var(--muted); text-align: center; margin: 0; }
.stage { width: 100%; display: flex; justify-content: center; perspective: 900px; touch-action: none; cursor: grab; padding: 10px 0; }
.stage:active { cursor: grabbing; }
.card3d {
  position: relative; width: min(84vw, 380px); aspect-ratio: 900 / 760;
  transform-style: preserve-3d; will-change: transform;
}
.face {
  position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
}
.front { background: #F4EFE1; padding: 10px 10px 0; display: flex; flex-direction: column; }
.front img { display: block; width: 100%; aspect-ratio: 900 / 618; object-fit: cover; border-radius: 12px; pointer-events: none; -webkit-user-drag: none; }
.front .cap { flex: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 6px; color: #15122B; }
.front .cap b { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 9px; color: #9C6B8E; }
.front .cap i { font-style: normal; font-size: 20px; }
.back {
  transform: rotateY(180deg);
  background: var(--night); box-shadow: inset 0 0 0 5px var(--lilac), 0 18px 40px rgba(0, 0, 0, .5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 22px; text-align: center;
}
.back b { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 12px; line-height: 1.6; color: var(--fire); }
.back p { margin: 0; font-size: 22px; line-height: 1.1; color: var(--text); }
.glare { position: absolute; inset: 0; border-radius: 20px; pointer-events: none; mix-blend-mode: soft-light; }

</style>
</head>

        var half = Math.floor(r / 2.6) + (r % 6 === 5 ? 1 : 0);

        if (S.spring && r > 3 && (r * 7 + tr[0]) % 4 === 0) rect(tr[0] - half + ((r * 5 + tr[0]) % (half * 2 + 1)), GROUND - tr[1] + r, 1, 1, "#E8A3C0");
      }
    });
    rect(0, GROUND, W, H - GROUND, S.spring ? "#23382B" : "#1D2A23");
    var gc = S.spring ? "#3B5E44" : "#2C4235";
    grass.forEach(function (g, gi) {
      rect(g[0], g[1], 1, 1, gc); rect(g[0] + 1, g[1] - 1, 1, 1, gc);
      if (S.spring && gi % 2 === 0) rect(g[0] + 1, g[1] - 2, 1, 1, ["#F2A7C3", "#FFE7A3", "#F4EFE1", "#C6B5F2"][gi % 4]);
    });
    if (S.spring) {
      for (var ff = 0; ff < 9; ff++) {
        var fxp = (ff * 37 + Math.round(Math.sin(frame * 0.05 + ff) * 6)) % W;
        var fyp = GROUND - 8 - (ff * 13) % 40 + Math.round(Math.cos(frame * 0.07 + ff * 2) * 3);
        if (reduce || Math.sin(frame * 0.2 + ff * 1.7) > -0.2) rect(fxp, fyp, 1, 1, "#D8F28A");
      }
    }

    var fx = 80, fy = GROUND + 14;
    if (S.fire) {
      for (var hy = -10; hy <= 10; hy++) for (var hx = -30; hx <= 30; hx++) {
        var d = (hx * hx) / 900 + (hy * hy) / 100;
        if (d < 1 && (hx + hy) % 2 === 0 && fy + hy > GROUND) rect(fx + hx, fy + hy, 1, 1, d < 0.45 ? "#4A3A2A" : "#33352A");
      }
    }
    sprite(TENT, { l: "#4F6B4F", d: "#203026" }, 8, GROUND - 4);

    if (S.travelers) {
      sprite(MAN, { h: "#C6B5F2", s: "#E8B996", c: "#3D5A80", p: "#2B2B3A", b: "#5A3A28" }, 52, GROUND + 4);
      sprite(WOMAN, { h: "#8A5A36", s: "#E8B996", c: "#9C6B8E", p: "#2B2B3A", b: "#5A3A28" }, 62, GROUND + 4);
      // lanterne
      rect(70, GROUND + 9, 2, 3, "#FFE7A3"); rect(70, GROUND + 8, 2, 1, "#6B4429");
    }
    sprite(HERO, { h: "#E2603B", s: "#D9A27C", c: "#6B8F5E", p: "#2B2B3A", b: "#5A3A28" }, 98, GROUND + 4, true);

    rect(72, GROUND + 23, 17, 3, "#6B4429"); rect(74, GROUND + 22, 13, 1, "#8A5A36"); rect(75, GROUND + 25, 11, 2, "#4E311E");
    if (S.fire) {
      for (var c = 0; c < 11; c++) {
        var h = Math.max(1, Math.round(9 - Math.abs(c - 5) * 1.5 + (reduce ? 0 : Math.random() * 4 - 1.5)));
        for (var r = 0; r < h; r++) rect(75 + c, GROUND + 22 - r, 1, 1, r < h * 0.35 ? "#FFE7A3" : (r < h * 0.7 ? "#F6B44B" : "#E2603B"));
      }
      if (!reduce && Math.random() < (S.party ? 0.9 : 0.35)) sparks.push({ x: 76 + Math.random() * 9, y: GROUND + 12, vy: 0.6 + Math.random() * 0.7, life: 30 + Math.random() * 30, c: Math.random() > 0.5 ? "#FFE7A3" : "#F6B44B" });
    } else if (!reduce && frame % 3 === 0) {
      sparks.push({ x: 80 + Math.random() * 2, y: GROUND + 20, vy: 0.3, life: 25, c: "#5B5670" });
    }
    sparks = sparks.filter(function (s) {
      s.y -= s.vy; s.x += Math.sin((s.y + s.life) * 0.3) * 0.4; s.life--;
      if (s.life > 0 && s.y > 0) { rect(Math.round(s.x), Math.round(s.y), 1, 1, s.c); return true; }
      return false;
    });

    if (S.bundle && !S.baby) {
      var glow = reduce || Math.floor(frame / 5) % 2 === 0;
      if (glow) { rect(63, GROUND + 15, 10, 1, "#5E5280"); rect(62, GROUND + 16, 1, 4, "#5E5280"); rect(73, GROUND + 16, 1, 4, "#5E5280"); }
      sprite(BUNDLE, { k: "#8A5A36", w: "#F4EFE1" }, 64, GROUND + 16);
    }
    if (S.baby) {
      sprite(BABY, { w: "#F4EFE1", s: "#E8B996" }, 77, GROUND + 6);
      if (reduce || Math.floor(frame / 6) % 2 === 0) sprite(HEART, { r: "#F2A7C3" }, 78, GROUND - 2 - (reduce ? 0 : Math.floor((frame % 24) / 8)));
    }
  }
  function loop(ts) { if (ts - last > 110) { last = ts; drawScene(); } requestAnimationFrame(loop); }
  drawScene(); requestAnimationFrame(loop);

  (function () {
    var tc = document.getElementById("trophy").getContext("2d");
    var T = ["................", "...gggggggggg...", ".gggyyyyyyyyggg.", ".g.gyyyyyyyyg.g.", ".g.gyyyyyyyyg.g.",
      "..ggyyyyyyyygg..", "....gyyyyyyg....", ".....gyyyyg.....", "......gyyg......", ".......gg.......",
      ".......gg.......", "......gggg......", ".....dddddd.....", ".....dddddd.....", "................", "................"];
    var P = { g: "#B9741E", y: "#F6B44B", d: "#6B4429" };
    for (var r = 0; r < 16; r++) for (var k = 0; k < 16; k++) { var ch = T[r][k]; if (P[ch]) { tc.fillStyle = P[ch]; tc.fillRect(k, r, 1, 1); } }
  })();

  /* ---------- Histoire ---------- */
  var NAME = "Voyageur";
  var STORY = [
    { say: "La nuit tombe sur la forêt de Brumeval. {N} pose son sac au pied d’un vieux chêne." },
    { ask: "La pluie arrive. Comment monter le camp ?", opts: [
      ["Tendre un tarp entre deux arbres", "Tendu bien bas, le tarp tient malgré le vent."],
      ["Construire un abri en branchages", "Deux heures de boulot, mais l’abri est solide comme une cabane."]
    ], gain: "Compétence abri +1" },
    { ask: "Il faut du feu. Avec quoi l’allumer ?", opts: [
      ["Le ferro-cérium", "Trois étincelles, et l’amadou prend. Le feu crépite."],
      ["Un archet, à l’ancienne", "Les bras brûlent, mais la braise finit par naître."]
    ], gain: "Compétence feu +1", then: function () { S.fire = true; } },
    { say: "Au loin, une lanterne se balance entre les arbres. Deux silhouettes approchent.", then: function () { S.travelers = true; } },
    { who: "Le voyageur", say: "Bonsoir, {N}. On peut partager ton feu ? Ma femme et moi, on vient de loin." },
    { ask: "Que fais-tu ?", opts: [
      ["Les inviter à s’asseoir", "Ils posent leurs sacs et tendent les mains vers les flammes."],
      ["Leur proposer de la bière de sapin", "Lui accepte. Elle refuse poliment : « Pas pour moi en ce moment, merci. »"]
    ] },
    { who: "La voyageuse", say: "Mon mari et moi, on transporte quelque chose de précieux. Il ne sera prêt qu’au printemps.", then: function () { S.bundle = true; } },
    { ask: "Tu demandes :", opts: [
      ["« C’est un trésor ? »", "Il sourit : « En quelque sorte. Il grandit un peu chaque jour. »"],
      ["« Je peux le voir ? »", "Elle secoue la tête : « Pas encore. Il faut attendre la saison des fleurs. »"]
    ] },
    { who: "Le voyageur", say: "On repassera au printemps, {N}. D’ici là, entraîne-toi : on aura besoin de quelqu’un de solide." },
    { say: "L’hiver passe. {N} s’entraîne chaque jour au camp. Aux premières fleurs, la lanterne réapparaît entre les arbres.", then: function () {
      S.spring = true;
      var fl = document.getElementById("flash");
      fl.classList.remove("go"); void fl.offsetWidth; fl.classList.add("go");
      beep(660, 0.1, "triangle", 0.05); beep(880, 0.1, "triangle", 0.05, 0.1); beep(1320, 0.25, "triangle", 0.05, 0.2);
    } },
    { who: "La voyageuse", say: "Nous revoilà. Le chargement est prêt. Montre-nous ce que tu vaux." },
    { ask: "Épreuve de force : le précieux chargement pèse 3,5 kg et ne doit jamais toucher le sol. Comment le portes-tu ?", opts: [
      ["À bout de bras, pendant des heures", "Tes bras tremblent. Toutes ces séances de muscu servent enfin à quelque chose."],
      ["Je fabrique une écharpe de portage avec ma toile", "Il siffle : « Malin. Ça va beaucoup servir. »"]
    ], gain: "Objet obtenu : écharpe de portage" },
    { ask: "Épreuve d’endurance : en pleine nuit, des pleurs résonnent dans le camp. Toutes les trois heures.", opts: [
      ["Chanter doucement près du feu", "Les pleurs se calment. Elle te regarde, émue."],
      ["Bercer doucement le chargement", "Le calme revient. Elle te regarde, émue."]
    ], gain: "Endurance +3" },
    { who: "La voyageuse", say: "Tu ferais un drôle de bon compagnon de route, {N}." },
    { ask: "Il te tend la main : « Tu veux faire partie du voyage ? »", opts: [
      ["Oui, évidemment", null],
      ["Bien sûr que oui", null]
    ], final: true }
  ];
  var TIPS = [
    "Astuce : un feu se prépare avant la nuit, pas pendant.",
    "Astuce : un bon tarp se tend bas quand le vent tourne.",
    "Astuce : garde toujours ton amadou au sec.",
    "Astuce : ne laisse jamais un camp sans surveillance."
  ];

  var panel = document.getElementById("panel"), titleEl = document.getElementById("title"), screenEl = document.getElementById("screen");
  var mode = "start", idx = 0, typing = null, finishTyping = null, pendingResult = null;

  function fill(txt) { return txt.replace(/\{N\}/g, NAME); }
  function esc(t) { return t.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function setPanel(html) { panel.innerHTML = html; panel.scrollTop = 0; }

  function typeInto(elm, txt, onDone) {
    if (reduce) { elm.textContent = txt; onDone(); return; }
    var n = 0;
    typing = setInterval(function () {
      n++; elm.textContent = txt.slice(0, n);
      if (n % 2 === 0 && txt[n - 1] !== " ") blip();
      if (n >= txt.length) { clearInterval(typing); typing = null; finishTyping = null; onDone(); }
    }, 34);
    finishTyping = function () { clearInterval(typing); typing = null; finishTyping = null; elm.textContent = txt; onDone(); };
  }

  function showStart() {
    mode = "start"; idx = 0;
    S.fire = false; S.travelers = false; S.bundle = false; S.baby = false; S.party = false; S.spring = false;
    screenEl.classList.remove("compact");
    titleEl.style.display = "flex";
    setPanel('<div class="box"><div class="say">Une nuit en forêt. Un sac, une toile, un briquet. Et une aventure qui commence.</div></div>' +
      '<p class="hint">Touche l’écran pour commencer</p>');
  }

  function showName() {
    mode = "name";
    setPanel('<div class="box"><div class="who">Nouvelle partie</div>' +
      '<div class="field"><label for="hero">Comment s’appelle ton héros ?</label>' +
      '<input id="hero" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Ton prénom"></div></div>' +
      '<button class="btn" id="go" type="button">Commencer</button>');
    var input = document.getElementById("hero");
    input.addEventListener("click", function (e) { e.stopPropagation(); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); begin(); } });
    document.getElementById("go").addEventListener("click", function (e) { e.stopPropagation(); begin(); });
    function begin() {
      var v = input.value.trim();
      NAME = v ? v.charAt(0).toUpperCase() + v.slice(1) : "Voyageur";
      input.blur(); select(); showLoading();
    }
  }

  function showLoading() {
    mode = "loading";
    titleEl.style.display = "none";
    setPanel('<div class="box"><div class="who">Chargement du monde</div><div class="tip" id="tip"></div>' +
      '<div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div><div class="pct" id="pct">0 %</div></div>');
    var fillEl = document.getElementById("fill"), pct = document.getElementById("pct"), tip = document.getElementById("tip");
    var p = 0, ti = 0; tip.textContent = TIPS[0];
    var dur = reduce ? 1200 : 4600, t0 = performance.now();
    (function tick() {
      if (mode !== "loading") return;
      var k = Math.min(1, (performance.now() - t0) / dur), st = Math.floor(k * 20) / 20;
      if (st !== p) { p = st; if (Math.round(p * 20) % 2 === 0) beep(330 + p * 400, 0.03, "square", 0.02); }
      fillEl.style.width = (p * 100) + "%"; pct.textContent = Math.round(p * 100) + " %";
      var nti = Math.min(TIPS.length - 1, Math.floor(k * TIPS.length));
      if (nti !== ti) { ti = nti; tip.textContent = TIPS[ti]; }
      if (k < 1) requestAnimationFrame(tick); else setTimeout(function () { idx = 0; play(); }, 350);
    })();
  }

  function play() {
    var node = STORY[idx];
    if (!node) return;
    if (node.say) {
      mode = "say";
      if (node.then) node.then();
      setPanel('<div class="box"><div class="who">' + esc(node.who || "Récit") + '</div><div class="say" id="say"></div><span class="more" id="more" hidden>▼</span></div>' +
        (idx === 0 ? '<p class="hint" id="hint" hidden>Touche pour continuer</p>' : ''));
      var more = document.getElementById("more"), hint = document.getElementById("hint");
      typeInto(document.getElementById("say"), fill(node.say), function () { more.hidden = false; if (hint) hint.hidden = false; });
    } else if (node.ask) {
      mode = "ask";
      var html = '<div class="box"><div class="who">' + (node.final ? "Le voyageur" : "Choix") + '</div><div class="say" id="say"></div></div><div class="opts" id="opts" hidden>';
      node.opts.forEach(function (o, i) { html += '<button class="opt" type="button" data-i="' + i + '">' + esc(fill(o[0])) + '</button>'; });
      html += '</div>';
      setPanel(html);
      var opts = document.getElementById("opts");
      typeInto(document.getElementById("say"), fill(node.ask), function () {
        opts.hidden = false;
        var lastOpt = opts.lastElementChild;
        if (lastOpt && lastOpt.scrollIntoView) lastOpt.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
      });
      opts.addEventListener("click", function (e) {
        var b = e.target.closest(".opt"); if (!b) return;
        e.stopPropagation();
        choose(node, Number(b.getAttribute("data-i")));
      });
    }
  }

  function choose(node, i) {
    select();
    if (node.final) { accept(); return; }
    if (node.then) node.then();
    mode = "result";
    setPanel('<div class="box"><div class="who">Résultat</div><div class="say" id="say"></div>' +
      (node.gain ? '<div class="gain" id="gain" hidden>' + esc(node.gain) + '</div>' : '') +
      '<span class="more" id="more" hidden>▼</span></div>');
    var more = document.getElementById("more"), gain = document.getElementById("gain");
    typeInto(document.getElementById("say"), fill(node.opts[i][1]), function () {
      if (gain) { gain.hidden = false; gainSfx(); }
      more.hidden = false;
    });
  }

  function accept() {
    mode = "end";
    screenEl.classList.add("compact");
    var flash = document.getElementById("flash");
    flash.classList.remove("go"); void flash.offsetWidth; flash.classList.add("go");
    fanfare();
    S.baby = true; S.party = true;
    document.getElementById("toastName").textContent = "Tonton Quentin";
    var toast = document.getElementById("toast");
    toast.classList.add("on");
    setTimeout(function () { toast.classList.remove("on"); }, 3800);
    setTimeout(function () { S.party = false; }, 4000);
    setPanel('<div class="box end">' +
      '<div class="big">Tonton Quentin</div>' +
      '<p>Le précieux chargement arrive en mai 2027.</p>' +
      '<p class="reveal">Les deux voyageurs, ce sont Paul et Jordane.</p>' +
      '</div>' +
      '<button class="item" id="item" type="button"><canvas id="itemIcon" width="16" height="16" aria-hidden="true"></canvas>' +
      '<div><small>Objet reçu !</small><span>Touche pour l’ouvrir</span></div></button>' +
      '<button class="btn ghost" id="again" type="button">Rejouer</button>');
    drawItemIcon();
    document.getElementById("item").addEventListener("click", function (e) { e.stopPropagation(); openViewer(); });
    document.getElementById("again").addEventListener("click", function (e) { e.stopPropagation(); select(); showStart(); });
  }

  /* ---------- Objet reçu : carte 3D ---------- */
  function drawItemIcon() {
    var c2 = document.getElementById("itemIcon"); if (!c2) return;
    var g = c2.getContext("2d");
    var T = ["................", ".cccccccccccccc.", ".cdddddddddddc..", ".cdddwwwddddddc.", ".cddwwwwwddddddc", ".cddwwwwwwwwdddc",
      ".cdddwwwwwwwwddc", ".cddddwwwwwwdddc", ".cdddddddddddddc", ".cccccccccccccc.", ".cyyyyyyyyyyyyc.", ".cyyyyyyyyyyyyc.",
      ".cccccccccccccc.", "................", "......s..s......", "................"];
    T[2] = ".cdddddddddddddc";
    var P = { c: "#F4EFE1", d: "#2A2459", w: "#9C95C2", y: "#F6B44B", s: "#FFE7A3" };
    for (var r = 0; r < 16; r++) for (var k = 0; k < 16; k++) { var ch = T[r][k]; if (P[ch]) { g.fillStyle = P[ch]; g.fillRect(k, r, 1, 1); } }
  }

  var viewer = document.getElementById("viewer"), stage = document.getElementById("stage"), card = document.getElementById("card3d");
  var glares = [document.getElementById("glare1"), document.getElementById("glare2")];
  var touched = false, rx = 0, ry = 0, vx = 0, vy = 0, dragging = false, lastX = 0, lastY = 0, lastT = 0, raf = null, t0v = 0;

  function render() {
    card.style.transform = "rotateX(" + rx.toFixed(2) + "deg) rotateY(" + ry.toFixed(2) + "deg)";
    var a = ((ry % 360) + 360) % 360;
    var gx = 50 + Math.sin(a * Math.PI / 180) * 45, gy = 50 - rx * 1.2;
    glares.forEach(function (gl) {
      gl.style.background = "radial-gradient(circle at " + gx.toFixed(1) + "% " + gy.toFixed(1) + "%, rgba(255,255,255,.75), rgba(255,255,255,0) 55%)";
    });
  }
  function animate(ts) {
    raf = null;
    if (!dragging) {
      if (Math.abs(vx) + Math.abs(vy) > 0.05 && !reduce) {
        ry += vy; rx = Math.max(-40, Math.min(40, rx + vx));
        vx *= 0.94; vy *= 0.94;
      } else {
        vx = 0; vy = 0;
        var targetY = touched ? Math.round(ry / 180) * 180 : Math.round(ry / 360) * 360;
        var idle = reduce ? 0 : Math.sin((ts - t0v) / 900) * 6;
        ry += (targetY + idle - ry) * 0.08;
        rx += ((reduce ? 0 : Math.cos((ts - t0v) / 1100) * 4) - rx) * 0.08;
      }
    }
    render();
    if (!viewer.hidden) raf = requestAnimationFrame(animate);
  }
  function openViewer() {
    select(); fanfare();
    viewer.hidden = false;
    touched = false; rx = -10; ry = -300; vx = 0; vy = reduce ? 0 : 9; t0v = performance.now();
    if (reduce) ry = 0;
    render();
    if (!raf) raf = requestAnimationFrame(animate);
    document.getElementById("closeViewer").focus({ preventScroll: true });
  }
  function closeViewer() {
    viewer.hidden = true;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    var it = document.getElementById("item"); if (it) it.focus({ preventScroll: true });
  }
  viewer.addEventListener("click", function (e) { e.stopPropagation(); });
  document.getElementById("closeViewer").addEventListener("click", function (e) { e.stopPropagation(); select(); closeViewer(); });
  stage.addEventListener("pointerdown", function (e) {
    dragging = true; touched = true; lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); vx = 0; vy = 0;
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });
  stage.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var now = performance.now(), dx = e.clientX - lastX, dy = e.clientY - lastY, dt = Math.max(1, now - lastT);
    ry += dx * 0.45; rx = Math.max(-40, Math.min(40, rx - dy * 0.35));
    vy = dx * 0.45 * (16 / dt); vx = -dy * 0.35 * (16 / dt);
    vy = Math.max(-25, Math.min(25, vy)); vx = Math.max(-10, Math.min(10, vx));
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    render();
  });
  function endDrag() { dragging = false; t0v = performance.now(); }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !viewer.hidden) closeViewer(); });

  function advance() {
    if (mode === "start") { select(); showName(); return; }
    if (typing && finishTyping) { finishTyping(); return; }
    if (mode === "say" || mode === "result") { idx++; select(); play(); }
  }
  screenEl.addEventListener("click", advance);
  document.addEventListener("keydown", function (e) {
    if (mode === "name") return;
    if (!document.getElementById("viewer").hidden) return;
    if ((e.key === "Enter" || e.key === " ") && (mode === "start" || mode === "say" || mode === "result")) { e.preventDefault(); advance(); }
  });

  showStart();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
